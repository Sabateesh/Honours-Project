data:
  root: data_vscode/
  img_size: 768
  num_workers: 4
  batch_size: 8
  val_frac: 0.15
  test_frac: 0.15
  seed: 42

model:
  use_ocr: false
  cnn_backbone: resnet50
  text_encoder: sentence-transformers/all-MiniLM-L6-v2
  fusion_hidden: 256
  dropout: 0.3

train:
  # both previous runs peaked at epoch 5 of 10 and overfit after
  epochs: 7
  lr: 1.0e-4
  weight_decay: 1.0e-4
  pos_weight_auto: true
  pos_weight_override: null

paths:
  checkpoint: checkpoints/vscode_768_v3.pt
  ocr_cache: cache/ocr.json

logging:
  level: INFO